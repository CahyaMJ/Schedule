<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jadwal Teknisi HEC </title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

</head>
<body>
  <header>
    <div class="logo">
      <img src="assets/logo.svg" alt="Logo HEC" />
    </div>
    <h1>Schedule / Jadwal Teknisi<br>HEC (Haurgeulis Education Center)</h1>
  </header>

  <section class="filters">
    <div class="filter-left">
      <label for="filter-teknisi">Filter Teknisi:</label>
      <input type="text" id="filter-teknisi" placeholder="Nama teknisi...">
  
      <label for="filter-tanggal">Filter Tanggal:</label>
      <input type="date" id="filter-tanggal">
    </div>
  
    <div class="action-buttons">
      <button id="btnTambah">Tambah Data</button>
      <input type="file" id="importExcel" accept=".xlsx" style="display: none;" />
      <button id="btnImport">Import Excel</button>
      <button id="btnExport">Export Excel</button>
    </div>
  </section>

  <main class="main-content">
    <aside class="sidebar">
      <div class="sidebar-buttons">
        <button class="filter-btn active" data-barang="Semua">Semua</button>
        <button class="filter-btn" data-barang="Monitor">Monitor</button>
        <button class="filter-btn" data-barang="Printer">Printer</button>
        <button class="filter-btn" data-barang="CCTV">CCTV</button>
        <button class="filter-btn" data-barang="Pengetikan">Pengetikan</button>
        <button class="filter-btn" data-barang="Laptop">Laptop</button>
      </div>
    
      <div class="sidebar-footer">
        Made with <span class="heart">❤</span> by <strong>LANA</strong>
      </div>
    </aside>
    
    

    <div class="content-area">
      <section id="jadwalTableSection" class="table-container">
        <table>
          <thead>
            <tr>
              <th>TEKNISI</th>
              <th>TANGGAL</th>
              <th>JAM</th>
              <th>PEKERJAAN</th>
              <th>JENIS BARANG</th>
              <th>KERUSAKAN</th>
              <th>ESTIMASI</th>
              <th>BIAYA</th>
              <th>GARANSI</th>
              <th>AKSI</th>
            </tr>
          </thead>
          <tbody id="jadwal-body">
            <!-- Data akan dimuat otomatis -->
          </tbody>
        </table>
      </section>
    </div>

  </main>

<!-- Modal Form -->
<div id="formModal" class="modal" style="display: none;">
  <div class="modal-content">
    <span class="close close-btn">&times;</span>
    <h2 id="modalTitle">Tambah Data Teknisi</h2>
    <form id="dataForm">
      <input type="hidden" id="editId">
    
      <div class="form-grid">
        <div class="form-group">
          <label for="teknisi">Teknisi:</label>
          <input type="text" id="teknisi" required>
        </div>
    
        <div class="form-group">
          <label for="tanggal">Tanggal:</label>
          <input type="date" id="tanggal" required>
        </div>
    
        <div class="form-group">
          <label for="jam">Jam:</label>
          <input type="time" id="jam" required>
        </div>
    
        <div class="form-group">
          <label for="pekerjaan">Pekerjaan:</label>
          <input type="text" id="pekerjaan" required>
        </div>
    
        <div class="form-group">
          <label for="jenis_barang">Jenis Barang:</label>
          <select id="jenis_barang" required>
            <option value="">Pilih Jenis</option>
            <option value="Monitor">Monitor</option>
            <option value="Printer">Printer</option>
            <option value="CCTV">CCTV</option>
            <option value="Pengetikan">Pengetikan</option>
            <option value="Laptop">Laptop</option>
          </select>
        </div>
    
        <div class="form-group">
          <label for="kerusakan">Kerusakan:</label>
          <input type="text" id="kerusakan" required>
        </div>
    
        <div class="form-group">
          <label for="estimasi_pengerjaan">Estimasi:</label>
          <input type="text" id="estimasi_pengerjaan" required>
        </div>
    
        <div class="form-group">
          <label for="biaya">Biaya:</label>
          <input type="number" id="biaya" required>
        </div>
    
        <div class="form-group">
          <label for="garansi">Garansi:</label>
          <input type="text" id="garansi" required>
        </div>
      </div>
    
      <button type="submit" class="submit-btn">Simpan</button>
    </form>
  </div>
</div>

  <script src="js/script.js"></script>
</body>
</html>
